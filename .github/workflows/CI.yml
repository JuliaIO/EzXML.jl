name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - 'x64'
          - 'x86'
        include:
          - os: ubuntu-latest
            version: '1.6'
            arch: x64
          - os: ubuntu-latest
            version: '1.6'
            arch: x86
          - os: macos-15-intel
            version: '1'
            arch: x64
          - os: macos-15-intel
            version: 'pre'
            arch: x64
          - os: macos-latest
            version: '1'
            arch: aarch64
          - os: macos-latest
            version: 'pre'
            arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          show-versioninfo: true
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required
          files: lcov.info