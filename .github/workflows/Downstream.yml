name: Downstream
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "CellMLToolkit"
          - "DocumenterEpub"
          - "FlowWorkspace"
          - "ForSyDeIO"
          - "Genie"
          - "MathML"
          - "ODMXMLTools"
          - "OMETIFF"
          - "OSMToolset"
          - "Pioneer"
          - "PlantGeom"
          - "PPTX"
          - "QuakeML"
          - "Serde"
          - "TCXReader"
          - "VMRobotControl"
          - "VulkanSpec"
          - "WannierIO"
          - "XbrlXML"
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: 1
          arch: x64
          show-versioninfo: true
      - uses: julia-actions/julia-buildpkg@latest
      - name: Load this and run the downstream tests
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.update()
          Pkg.activate(;temp=true)
          # force it to use this PR's version of the package
          ENV["JULIA_PKG_DEVDIR"]= mktempdir()
          downstream = "${{ matrix.package }}"
          spec = downstream == "ForSyDeIO" ?
            PackageSpec(url="https://github.com/forsyde/forsyde-io.git", subdir="julia-core") :
            PackageSpec(name=downstream)
          Pkg.develop([
            PackageSpec(path="."),
            spec,
          ])
          Pkg.update()
          Pkg.test(downstream)
